# Caddy-Snippet für den Rabatt-Finder unter /angebote/.
# Wird nach /etc/caddy/rabatt-finder.caddy kopiert und im Site-Block von /etc/caddy/Caddyfile importiert:
#
#   srv2025840.hstgr.cloud {
#       encode gzip
#       import /etc/caddy/rabatt-finder.caddy
#       ...bestehende handle-Blöcke...
#   }
#
# Caddy wertet handle_path /angebote/* vor dem allgemeinen handle-Block aus, die übrige Website bleibt unverändert.
# Die Zugangsdaten (Benutzer + Passwort-Hash) stehen in /etc/caddy/rabatt-finder.auth.

redir /angebote /angebote/

handle_path /angebote/* {
	import /etc/caddy/rabatt-finder.auth
	root * /var/www/angebote
	header X-Robots-Tag "noindex, nofollow"
	header Cache-Control "no-cache"
	file_server
}
