# In den bestehenden Site-Block der Website in /etc/caddy/Caddyfile einfügen, z. B.:
#
#   srv2025840.hstgr.cloud {
#       ...bestehende Einstellungen...
#       import /opt/rabatt-finder/deploy/caddy-angebote.conf
#   }
#
# Liefert /angebote/ als statische Seite aus, geschützt mit Benutzername/Passwort.
# Das Passwort steht als Hash in /etc/caddy/rabatt-finder.auth (siehe Installationsanleitung).

redir /angebote /angebote/

handle_path /angebote/* {
	root * /var/www/angebote
	import /etc/caddy/rabatt-finder.auth
	header X-Robots-Tag "noindex, nofollow"
	header Cache-Control "no-cache"
	encode gzip
	file_server
}
