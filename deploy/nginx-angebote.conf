# In den bestehenden server { ... }-Block der Website einfügen (für HTTPS: den Block mit "listen 443").
# Liefert /angebote/ als statische Seite aus, geschützt mit Benutzername/Passwort.

location = /angebote {
    return 301 /angebote/;
}

location /angebote/ {
    alias /var/www/angebote/;
    index index.html;

    auth_basic "Rabatt-Finder";
    auth_basic_user_file /etc/nginx/rabatt-finder.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types application/json text/css application/javascript;
}
